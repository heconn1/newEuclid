INITIAL_VALUE_OF_K 5
MINIMAL_VALUE_OF_K 0  ### if you're just interested in norm-Euclideanity, put 1 instead of 0 
PRINCIPAL 1 ### 0 -> just principal cases,  1-> all, 2 -> not principal cases, with euclidean classes
ITERATIONS_WITHOUT_UNITS 0 ### if you want to apply the test of units only after some cuttings
DISPLAY_LEVEL 0 ### 0 displays just the final result, 1 more details, 2 even more
EPS0 0.00001 ### for Gamma(K)
EPS2 0.00001 ### for the absorption test
EPS3 0.0001  ### for the tests of units
EPS4 0.1     ### for rounding floats
MAXITERATIONS 7  ### maximal number of iterations without improving the smallest number of problems found
NOMBRE_MAX_PB 1000000 ### maximal number of problems to apply absorption test
NOMBRE_MAX_PB2 230000 ### maximal number of problems after a loop (units+cutting+absorption)
MAX_PB_CONV 600       ### maximal number of problems to test if the graph is convenient
NB_UNITS 3  ### should be > 0
LANGUAGE 1  ### 0 -> français ; 1 -> english
BOUNDS- -30 -500 -100 -20 -12 -5 -3 -3 -3 -2 -2 -1 -1 -1 -1 ### lower bounds for the integers
BOUNDS+  30  500  100  20  12  5  3  3  2  2  2  1  1  1  1 ### upper bounds for the integers
CUTTING 100  700  70  28  22 20 16 14 12 10  8  8  8  8  8 ### number of cutting in each direction
PARI_STACK_SIZE 100000000